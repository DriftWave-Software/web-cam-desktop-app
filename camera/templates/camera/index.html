<!DOCTYPE html>
<html>
<head>
    <title>Selfie Booth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        #video {
            width: 640px;
            height: 480px;
            background-color: #000;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        #canvas {
            display: none;
        }
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        #preview {
            max-width: 320px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selfie Booth</h1>
        <video id="video" autoplay></video>
        <canvas id="canvas"></canvas>
        <div>
            <button id="capture" class="button">Take Photo</button>
        </div>
        <img id="preview" alt="Preview">
        <div id="message"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const captureButton = document.getElementById('capture');
        const messageDiv = document.getElementById('message');
        const context = canvas.getContext('2d');

        // Access the webcam
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: 640,
                        height: 480,
                        facingMode: "user"
                    } 
                });
                video.srcObject = stream;
            } catch (err) {
                showMessage('Error accessing camera: ' + err.message, false);
            }
        }

        function showMessage(text, isSuccess) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + (isSuccess ? 'success' : 'error');
        }

        // Capture photo
        captureButton.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert to base64
            const imageData = canvas.toDataURL('image/png');
            preview.src = imageData;
            preview.style.display = 'block';

            // Send to server
            const formData = new FormData();
            formData.append('image', imageData);

            fetch('/capture/', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('Photo captured successfully!', true);
                } else {
                    showMessage('Error: ' + data.error, false);
                }
            })
            .catch(error => {
                showMessage('Error saving photo: ' + error.message, false);
            });
        });

        // Initialize camera when page loads
        initCamera();
    </script>
</body>
</html>
