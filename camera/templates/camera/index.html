<!DOCTYPE html>
<html>
<head>
    <title>Selfie Booth</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; media-src 'self' blob:">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        #video {
            width: 640px;
            height: 480px;
            background-color: #000;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        #canvas {
            display: none;
        }
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        #preview {
            max-width: 320px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selfie Booth</h1>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div>
            <button id="capture" class="button">Take Photo</button>
        </div>
        <img id="preview" alt="Preview">
        <div id="message"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const captureButton = document.getElementById('capture');
        const messageDiv = document.getElementById('message');
        const context = canvas.getContext('2d');

        // Access the webcam
        async function initCamera() {
            try {
                // Check if mediaDevices is supported
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('WebRTC is not supported by this browser');
                }

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "user"
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();  // Ensure video starts playing
                
                // Set canvas size to match video
                canvas.width = 1280;
                canvas.height = 720;
            } catch (err) {
                showMessage('Error accessing camera: ' + err.message, false);
                console.error('Camera error:', err);
            }
        }

        function showMessage(text, isSuccess) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + (isSuccess ? 'success' : 'error');
        }

        // Capture photo
        captureButton.addEventListener('click', async () => {
            try {
                // Draw the current video frame to the canvas
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Convert to base64
                const imageData = canvas.toDataURL('image/jpeg', 0.95);
                preview.src = imageData;
                preview.style.display = 'block';

                // Create form data
                const formData = new FormData();
                formData.append('image', imageData);

                // Send to server
                const response = await fetch('/capture/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage('Photo captured successfully!', true);
                } else {
                    showMessage('Error: ' + (data.error || 'Unknown error'), false);
                }
            } catch (err) {
                showMessage('Error capturing photo: ' + err.message, false);
                console.error('Capture error:', err);
            }
        });

        // Initialize camera when page loads
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(initCamera, 1000); // Add a small delay to ensure WebView is ready
        });
    </script>
</body>
</html>
